<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYU // RESULT SEARCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Inline script to prevent theme flash on load
    (function() {
      const saved = localStorage.getItem('hyu_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
  <style>
    :root {
      --bg: #000000;
      --header-bg: #050505;
      --card-bg: #0a0a0a;
      --card-border: #262626;
      --border-hover: #555555;
      --header-border: #262626;
      --text: #ffffff;
      --text-muted: #888888;
      --input-bg: #000000;
      --input-placeholder: #555555;
      --btn-bg: #ffffff;
      --btn-text: #000000;
      --btn-hover-bg: #cccccc;
      --brand-icon-bg: #ffffff;
      --brand-icon-text: #000000;
      --card-header-bg: #050505;
      --badge-border: #ffffff;
      --badge-text: #ffffff;
      --summary-bg: #050505;
      --spinner-bg: #222222;
      --spinner-top: #ffffff;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --header-bg: #f8f8f8;
      --card-bg: #ffffff;
      --card-border: #dcdcdc;
      --border-hover: #888888;
      --header-border: #dcdcdc;
      --text: #000000;
      --text-muted: #666666;
      --input-bg: #ffffff;
      --input-placeholder: #999999;
      --btn-bg: #000000;
      --btn-text: #ffffff;
      --btn-hover-bg: #333333;
      --brand-icon-bg: #000000;
      --brand-icon-text: #ffffff;
      --card-header-bg: #f4f4f4;
      --badge-border: #000000;
      --badge-text: #000000;
      --summary-bg: #f4f4f4;
      --spinner-bg: #e0e0e0;
      --spinner-top: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.15s, color 0.15s;
    }

    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--header-border);
      padding: 1rem 1.5rem;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .header-container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-icon {
      border: 1px solid var(--text);
      padding: 4px 8px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: var(--brand-icon-bg);
      color: var(--brand-icon-text);
      transition: background-color 0.15s, color 0.15s;
    }

    .brand-text h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .theme-toggle-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 0.45rem 0.85rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s;
    }

    .theme-toggle-btn:hover {
      border-color: var(--text);
      background: var(--btn-bg);
      color: var(--btn-text);
    }

    main {
      max-width: 1000px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1rem;
      flex: 1;
    }

    .search-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 1.75rem;
      margin-bottom: 2rem;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .search-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .search-subtitle {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-bottom: 1.5rem;
      letter-spacing: 0.02em;
    }

    .search-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .input-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 260px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s, background-color 0.15s, color 0.15s;
    }

    .search-input:focus {
      border-color: var(--text);
    }

    .search-input::placeholder {
      color: var(--input-placeholder);
    }

    .search-btn {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-bg);
      padding: 0.75rem 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.15s, color 0.15s;
    }

    .search-btn:hover {
      background: var(--btn-hover-bg);
      border-color: var(--btn-hover-bg);
    }

    .search-btn:active {
      transform: translateY(1px);
    }

    .search-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      padding-top: 0.85rem;
      border-top: 1px solid var(--card-border);
    }

    .mode-radios {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .mode-radios label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text);
    }

    .mode-radios input[type="radio"] {
      accent-color: var(--text);
    }

    /* Results section */
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .results-summary {
      padding: 0.75rem 1.25rem;
      border: 1px solid var(--card-border);
      background: var(--summary-bg);
      font-size: 0.8rem;
      color: var(--text);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 700;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .student-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px dashed var(--card-border);
    }

    .student-group:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .student-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 1.5rem;
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      flex-wrap: wrap;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .student-photo {
      width: 85px;
      height: 105px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 0.7rem;
      flex-shrink: 0;
      letter-spacing: 0.05em;
    }

    .student-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
    }

    .student-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.85rem 1.5rem;
      flex: 1;
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .info-val {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    .exam-accordion {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .exam-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      overflow: hidden;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .exam-card:hover {
      border-color: var(--border-hover);
    }

    .exam-header {
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      background: var(--card-header-bg);
      transition: background-color 0.15s;
    }

    .exam-title-box {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .exam-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .exam-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .badge {
      padding: 0.15rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: 1px solid var(--badge-border);
      color: var(--badge-text);
      background: transparent;
    }

    .badge-fail {
      border-style: dashed;
      color: var(--text-muted);
      border-color: var(--text-muted);
    }

    .badge-supp {
      border-style: dotted;
      color: var(--text-muted);
      border-color: var(--text-muted);
    }

    .btn-open-tab {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-bg);
      padding: 0.55rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }

    .btn-open-tab:hover {
      background: var(--bg);
      color: var(--text);
      border-color: var(--text);
    }

    .loader {
      display: none;
      text-align: center;
      padding: 3rem 1rem;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 2px solid var(--spinner-bg);
      border-top-color: var(--spinner-top);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert {
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      border: 1px solid var(--text);
      background: var(--card-bg);
      color: var(--text);
    }

    footer {
      border-top: 1px solid var(--card-border);
      text-align: center;
      padding: 1.25rem;
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: auto;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">HYU</div>
        <div class="brand-text">
          <h1>Hemchand Yadav Vishwavidyalaya</h1>
          <p>Durg University Result Engine</p>
        </div>
      </div>
      <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
        [ LIGHT MODE ]
      </button>
    </div>
  </header>

  <main>
    <div class="search-card">
      <h2 class="search-title">Result Search</h2>
      <p class="search-subtitle">Search by Roll Number or Student Name</p>

      <form class="search-form" id="searchForm" onsubmit="event.preventDefault(); handleSearch();">
        <div class="input-group">
          <input 
            type="text" 
            class="search-input" 
            id="rollInput" 
            placeholder="Enter Roll Number or Name..." 
            autocomplete="off"
            required
          />
          <button type="submit" class="search-btn" id="searchBtn">
            [ Search Result ]
          </button>
        </div>

        <div class="search-options">
          <div class="mode-radios">
            <span style="color: var(--text-muted);">Mode:</span>
            <label><input type="radio" name="searchMode" value="both" checked> Auto (DB + Live)</label>
            <label><input type="radio" name="searchMode" value="db"> Database Cache</label>
            <label><input type="radio" name="searchMode" value="live"> Live Scrape</label>
          </div>
        </div>
      </form>
    </div>

    <!-- Error Alert -->
    <div id="errorBox" class="alert" style="display: none;"></div>

    <!-- Loading State -->
    <div id="loader" class="loader">
      <div class="spinner"></div>
      <h3 id="loaderText" style="font-size: 0.9rem; font-weight: 500; letter-spacing: 0.05em;">QUERYING MARKSHEETS...</h3>
      <p style="color: var(--text-muted); font-size: 0.75rem; margin-top: 4px;" id="loaderTimer">0.0s</p>
    </div>

    <!-- Results Display -->
    <div id="resultsContainer" class="results-container" style="display: none;"></div>
  </main>

  <footer>
    <p>Hemchand Yadav Vishwavidyalaya Results Engine &copy; 2026</p>
  </footer>

  <script>
    let timerInterval = null;
    let currentMarksheets = [];

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('hyu_theme', theme);
      const btn = document.getElementById('themeToggleBtn');
      if (btn) {
        btn.innerText = theme === 'light' ? '[ DARK MODE ]' : '[ LIGHT MODE ]';
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'light' ? 'dark' : 'light';
      applyTheme(next);
    }

    // Initialize button label on load
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('hyu_theme') || 'dark';
      applyTheme(saved);
    });

    async function handleSearch() {
      const query = document.getElementById('rollInput').value.trim();
      if (!query) return;

      const mode = document.querySelector('input[name="searchMode"]:checked').value;
      const errorBox = document.getElementById('errorBox');
      const loader = document.getElementById('loader');
      const resultsContainer = document.getElementById('resultsContainer');
      const loaderTimer = document.getElementById('loaderTimer');
      const searchBtn = document.getElementById('searchBtn');

      errorBox.style.display = 'none';
      resultsContainer.style.display = 'none';
      loader.style.display = 'block';
      searchBtn.disabled = true;

      const startTime = performance.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
        loaderTimer.innerText = `${elapsed}s`;
      }, 100);

      try {
        const url = `/api/results?rollno=${encodeURIComponent(query)}&mode=${encodeURIComponent(mode)}`;
        const res = await fetch(url);
        clearInterval(timerInterval);

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.detail || `Server error (${res.status})`);
        }

        const marksheets = await res.json();
        if (!marksheets || marksheets.length === 0) {
          throw new Error(`No examination records found for "${query}".`);
        }

        currentMarksheets = marksheets;
        renderResults(marksheets);
        resultsContainer.style.display = 'flex';
      } catch (err) {
        errorBox.innerText = err.message;
        errorBox.style.display = 'block';
      } finally {
        clearInterval(timerInterval);
        loader.style.display = 'none';
        searchBtn.disabled = false;
      }
    }

    function openMarksheetInNewTab(idx) {
      const m = currentMarksheets[idx];
      if (!m) return;

      const w = window.open('', '_blank');
      if (!w) {
        alert('Popup blocked. Please allow popups to view marksheet.');
        return;
      }

      const student = m.student_info || {};
      const status = (m.result_status || 'N/A').toUpperCase();
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';

      w.document.open();
      w.document.write(`<!DOCTYPE html>
<html lang="en" data-theme="${currentTheme}">
<head>
  <meta charset="UTF-8">
  <title>${m.exam_title || 'Marksheet'} - ${student.roll_no || ''} - ${student.name || ''}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>

    /* A4 Portrait Specification */

      }

      /* Reset Bootstrap grid offsets and box shadows from university HTML */
      .row, .col-lg-10, .col-md-offset-1, .col-lg-1, .well, .page-body, #page-wrap, .table-responsive {

        right: 0 !important;
        float: none !important;
        border: none !important;
        box-shadow: none !important;
        overflow: visible !important;
        box-sizing: border-box !important;
      }

      table, #print_result {
        width: 100% !important;
        max-width: 100% !important;
        border-collapse: collapse !important;
        table-layout: auto !important;
        font-size: 11px !important;
        color: #000000 !important;
        background: #ffffff !important;
      }

      th, td {
        border: 1px solid #000000 !important;
        color: #000000 !important;
        background: #ffffff !important;
        padding: 2px 4px !important;
        word-break: break-word !important;
      }

      th {
        background: #f0f0f0 !important;
        font-weight: 700 !important;
        text-align: center !important;
      }

      tr {
        page-break-inside: avoid !important;
        page-break-after: auto !important;

      img {
        max-width: 100% !important;
        height: auto !important;
      }

  </style>
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <div class="top-title">
        <h1>Hemchand Yadav Vishwavidyalaya</h1>
        <p>${m.exam_title || 'Examination Result'}</p>
      </div>
      <div class="actions">
        <span style="font-size: 0.75rem; color: var(--text-muted); align-self: center;">[ A4 PDF Format ]</span>
        <button class="btn" onclick="window.print()">[ Print / Save A4 PDF ]</button>
      </div>
    </div>

    <div class="meta-strip ${m.html ? 'print-hide' : ''}">
      <div class="meta-item">Candidate: <strong>${student.name || 'N/A'}</strong></div>
      <div class="meta-item">Roll No: <strong>${student.roll_no || 'N/A'}</strong></div>
      <div class="meta-item">Enrollment: <strong>${student.enrollment_no || 'N/A'}</strong></div>
      <div class="meta-item">Status: <strong>${status}</strong></div>
      <div class="meta-item">SGPA / Result: <strong>${m.sgpa || 'N/A'}</strong></div>
    </div>

    <div class="marksheet-content">
      ${m.html || '<p style="text-align:center; padding: 20px; color: var(--text-muted);">No raw HTML marksheet available.</p>'}
    </div>
  </div>

</html>`);
      w.document.close();
    }

    function groupMarksheetsByStudent(marksheets) {
      const studentMap = new Map();

      marksheets.forEach((m, globalIdx) => {
        const info = m.student_info || {};
        const enr = (info.enrollment_no || '').trim().toUpperCase();
        const roll = (info.roll_no || '').trim();
        const name = (info.name || '').trim().toUpperCase();

        // Unique identifier: Enrollment No if available, else Roll No, else Name
        const key = enr ? `ENR:${enr}` : (roll ? `ROLL:${roll}` : `NAME:${name}`);

        if (!studentMap.has(key)) {
          studentMap.set(key, {
            info: { ...info },
            items: []
          });
        }

        const s = studentMap.get(key);
        // Enrich profile info if this marksheet has more details
        if (!s.info.father_name && info.father_name) s.info.father_name = info.father_name;
        if (!s.info.college && (info.college || info.center)) s.info.college = info.college || info.center;
        if (!s.info.photo_url && info.photo_url) s.info.photo_url = info.photo_url;
        if (!s.info.roll_no && info.roll_no) s.info.roll_no = info.roll_no;
        if (!s.info.enrollment_no && info.enrollment_no) s.info.enrollment_no = info.enrollment_no;
        if (!s.info.name && info.name) s.info.name = info.name;

        s.items.push({ marksheet: m, globalIdx });
      });

      return Array.from(studentMap.values());
    }

    function renderResults(marksheets) {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      const students = groupMarksheetsByStudent(marksheets);

      if (students.length > 1) {
        const summary = document.createElement('div');
        summary.className = 'results-summary';
        const queryVal = document.getElementById('rollInput').value.trim().toUpperCase();
        summary.innerText = `[ MULTIPLE CANDIDATES FOUND: ${students.length} STUDENTS MATCHING "${queryVal}" ]`;
        container.appendChild(summary);
      }

      students.forEach((s) => {
        const studentWrapper = document.createElement('div');
        studentWrapper.className = 'student-group';

        const info = s.info || {};
        const photoHtml = info.photo_url 
          ? `<img src="${info.photo_url}" alt="Student Photo" onerror="this.parentElement.innerHTML='NO PHOTO';" />`
          : `<span>NO PHOTO</span>`;

        // Student Profile Header Card
        const studentCard = document.createElement('div');
        studentCard.className = 'student-card';
        studentCard.innerHTML = `
          <div class="student-photo">${photoHtml}</div>
          <div class="student-info-grid">
            <div class="info-item"><span class="info-label">Candidate Name</span><span class="info-val">${info.name || 'N/A'}</span></div>
            <div class="info-item"><span class="info-label">Roll Number</span><span class="info-val">${info.roll_no || 'N/A'}</span></div>
            <div class="info-item"><span class="info-label">Enrollment No</span><span class="info-val">${info.enrollment_no || 'N/A'}</span></div>
            <div class="info-item"><span class="info-label">Father's Name</span><span class="info-val">${info.father_name || 'N/A'}</span></div>
            <div class="info-item" style="grid-column: 1 / -1;"><span class="info-label">College / Center</span><span class="info-val">${info.college || info.center || 'N/A'}</span></div>
          </div>
        `;
        studentWrapper.appendChild(studentCard);

        // Student Marksheets
        const examsList = document.createElement('div');
        examsList.className = 'exam-accordion';

        s.items.forEach(({ marksheet: m, globalIdx }) => {
          const card = document.createElement('div');
          card.className = 'exam-card';

          const status = (m.result_status || 'N/A').toUpperCase();
          let badgeClass = 'badge';
          if (status.includes('FAIL')) badgeClass = 'badge badge-fail';
          else if (status.includes('SUPP') || status.includes('ATKT')) badgeClass = 'badge badge-supp';

          card.innerHTML = `
            <div class="exam-header">
              <div class="exam-title-box">
                <span class="exam-title">${m.exam_title || 'Examination Result'}</span>
                <span class="exam-meta">SGPA / Result: <strong>${m.sgpa || 'N/A'}</strong> • Status: <span class="${badgeClass}">${status}</span></span>
              </div>
              <button class="btn-open-tab" onclick="openMarksheetInNewTab(${globalIdx})">
                <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                Open Marksheet
              </button>
            </div>
          `;
          examsList.appendChild(card);
        });

        studentWrapper.appendChild(examsList);
        container.appendChild(studentWrapper);
      });
    }
  </script>
